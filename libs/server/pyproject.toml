[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepagents-server"
version = "0.0.1"
description = "HTTP server package for Deep Agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = []
maintainers = []
keywords = ["agents", "deepagents", "http", "server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
]

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "ruff>=0.8.0",
    "ty>=0.0.1,<1.0.0",
]

[project.scripts]
deepagents-server = "deepagents_server.__main__:main"

[project.urls]
Homepage = "https://docs.langchain.com/oss/python/deepagents/overview"
Documentation = "https://reference.langchain.com/python/deepagents/"
Repository = "https://github.com/langchain-ai/deepagents"
Issues = "https://github.com/langchain-ai/deepagents/issues"

[tool.uv]
package = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
division-by-zero = "error"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
known-first-party = ["deepagents_server"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN001",
    "ANN201",
    "D",
    "PLR2004",
    "S101",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
