// Agent OS Runtime Protocol
//
// Defines the gRPC interface between Control Plane and Data Plane.
// This is the ONLY communication boundary between the two layers.
//
// Three services:
//   AgentExecutor  - bidirectional streaming for agent execution + HITL
//   ResourceSync   - unary RPCs for syncing rich AgentSpecs and runtime directives
//   SessionQuery   - unary RPCs for checkpoint-backed session reads

syntax = "proto3";

package deepagents.runtime.v1;

option java_package = "com.deepagents.runtime.v1";
option go_package = "agentctl/pkg/proto;runtimev1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// -----------------------------------------------------------------------------
//  Service 1: AgentExecutor
//
//  Bidirectional streaming RPC for agent execution.
//  Client = Control Plane (sends control messages)
//  Server = Data Plane   (streams agent events)
// -----------------------------------------------------------------------------

service AgentExecutor {
  // Run an agent with bidirectional streaming.
  //
  // Protocol:
  //   1. Client sends RunRequest as the first ClientMessage
  //   2. Server streams AgentEvents (text, tool calls, etc.)
  //   3. If HITL is triggered, server sends HITLRequest and pauses
  //   4. Client sends HITLDecision, server resumes
  //   5. Client may send CancelRequest at any time
  //   6. Stream ends with RunEnded, RunCanceled, or ErrorOccurred
  rpc Run(stream ClientMessage) returns (stream AgentEvent);
}

// -----------------------------------------------------------------------------
// Client -> Server messages
// -----------------------------------------------------------------------------

message ClientMessage {
  oneof payload {
    RunRequest    run_request   = 1;
    HITLDecision  hitl_decision = 2;
    CancelRequest cancel        = 3;
  }
}

// Initial request to start agent execution.
message RunRequest {
  // Agent name (must exist in data plane's local registry).
  string agent_name = 1;

  // User message / prompt.
  string message = 2;

  // Optional: resume an existing conversation thread.
  // If empty, a new thread is created.
  string thread_id = 3;

  // Optional: caller-defined metadata for future runtime directives.
  // Currently accepted by the transport layer but not emitted in AgentEvent.
  map<string, string> metadata = 4;
}

// Client's response to an HITL interrupt.
message HITLDecision {
  // Must match the interrupt_id from the corresponding HITLRequest.
  string interrupt_id = 1;

  // One decision per action_request in the HITLRequest.
  repeated Decision decisions = 2;
}

message Action {
  // Action name (for example, "execute" or "write_file").
  string name = 1;

  // Proposed or edited arguments.
  google.protobuf.Struct args = 2;
}

message Decision {
  reserved 1, 2, 3;
  reserved "tool_call_id", "approved", "reason";

  // Decision type: "approve", "edit", or "reject".
  string type = 4;

  // Optional rejection message shown to the model.
  string message = 5;

  // Optional edited action when type = "edit".
  Action edited_action = 6;
}

// Request to cancel the current execution.
message CancelRequest {
  string reason = 1;
}

// -----------------------------------------------------------------------------
// Server -> Client messages
// -----------------------------------------------------------------------------

message AgentEvent {
  // Unique identifier for this execution run.
  string run_id = 1;

  // Agent name that produced this event.
  string agent_name = 2;

  // When this event was created.
  google.protobuf.Timestamp timestamp = 3;

  oneof payload {
    RunStarted    run_started     = 10;
    TextDelta     text_delta      = 11;
    TextDone      text_done       = 12;
    ToolCallStart tool_call_start = 13;
    ToolCallDone  tool_call_done  = 14;
    ToolResult    tool_result     = 15;
    HITLRequest   hitl_request    = 16;
    RunEnded      run_ended       = 17;
    ErrorOccurred error           = 18;
    RunCanceled   run_canceled    = 19;
  }
}

// Agent execution has started.
message RunStarted {
  // The thread_id for this run (may be newly generated).
  string thread_id = 1;
}

// Incremental text token(s) from the LLM.
message TextDelta {
  string text = 1;
}

// Full assembled text after all deltas.
// Sent once when the LLM finishes its response.
message TextDone {
  string text = 1;
}

// Agent is initiating a tool call.
message ToolCallStart {
  string tool_name    = 1;
  string tool_call_id = 2;
  // Stable tool arguments when the runtime could parse them.
  // Omitted when the call started before arguments became parseable.
  google.protobuf.Struct args = 3;
}

// Tool call execution completed (before result is available).
message ToolCallDone {
  string tool_name    = 1;
  string tool_call_id = 2;
}

// Result of a tool execution.
message ToolResult {
  string tool_call_id = 1;
  // Stable text projection kept for backward compatibility.
  string content      = 2;
  bool   is_error     = 3;
  // Raw JSON-like tool result when the runtime could preserve it.
  google.protobuf.Value payload = 4;
}

// Human-in-the-loop approval request.
// Agent is PAUSED until the client sends a corresponding HITLDecision.
message HITLRequest {
  // Unique interrupt identifier.
  string interrupt_id = 1;

  // Tool calls awaiting approval.
  repeated ActionRequest action_requests = 2;

  // Review policy for each requested action.
  repeated ReviewConfig review_configs = 3;
}

// A single tool call that needs human approval.
message ActionRequest {
  reserved 1, 2;
  reserved "action", "tool_call_id";

  // Action name (e.g., "execute", "write_file").
  string name = 4;

  // Proposed arguments.
  google.protobuf.Struct args = 3;

  // Human-readable description for review.
  string description = 5;
}

message ReviewConfig {
  // Action name associated with this review policy.
  string action_name = 1;

  // Allowed decision types for this action.
  repeated string allowed_decisions = 2;

  // Optional JSON schema for editable args.
  google.protobuf.Struct args_schema = 3;
}

// Agent execution completed normally.
message RunEnded {
  UsageStats stats = 1;
}

// Agent execution was canceled by the caller or runtime manager.
message RunCanceled {
  string reason = 1;
}

// Token usage and timing statistics.
message UsageStats {
  int32 request_count     = 1;
  int32 input_tokens      = 2;
  int32 output_tokens     = 3;
  float wall_time_seconds = 4;
}

// An error occurred during execution.
message ErrorOccurred {
  string message    = 1;
  string error_type = 2;
}

// -----------------------------------------------------------------------------
//  Service 2: ResourceSync
//
//  Unary RPCs for syncing runtime-ready inputs from Control Plane to Data Plane.
//  The control plane owns registry CRUD and packaging.
//  The data plane consumes rich AgentSpecs and runtime directives for
//  assembly, execution, and local runtime state management.
// -----------------------------------------------------------------------------

service ResourceSync {
  // Compatibility RPC for older callers that sync skills separately.
  rpc SyncSkill(SyncSkillRequest) returns (SyncResponse);

  // Compatibility RPC for older callers that sync MCP configs separately.
  rpc SyncMcp(SyncMcpRequest) returns (SyncResponse);

  // Push a rich agent spec to the data plane.
  rpc SyncAgentSpec(SyncAgentSpecRequest) returns (SyncResponse);

  // Trigger agent assembly on the data plane.
  // Prerequisite: the target AgentSpec must already be synced.
  rpc Assemble(AssembleRequest) returns (AssembleResponse);

  // Upload one or more files into an agent/thread workspace.
  rpc UploadWorkspaceFiles(UploadWorkspaceFilesRequest)
      returns (UploadWorkspaceFilesResponse);

  // Remove a synced runtime resource or cached spec from the data plane.
  rpc RemoveResource(RemoveResourceRequest) returns (SyncResponse);

  // Health check / readiness probe.
  rpc Health(HealthRequest) returns (HealthResponse);
}

// -----------------------------------------------------------------------------
//  Service 3: SessionQuery
//
//  Unary RPCs for reading runtime-local session state derived from
//  checkpoint storage.
// -----------------------------------------------------------------------------

// Query runtime-local session state derived from checkpoint storage.
service SessionQuery {
  // List recent sessions ordered by latest checkpoint update time.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // Get one session summary by agent_name + thread_id.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);

  // Read checkpoint-backed session messages for one agent-scoped thread.
  rpc GetSessionMessages(GetSessionMessagesRequest)
      returns (GetSessionMessagesResponse);

  // Resolve the latest session, optionally filtered by agent.
  rpc GetLatestSession(GetLatestSessionRequest)
      returns (GetLatestSessionResponse);

  // Delete one local session from checkpoint storage by agent_name + thread_id.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
}

// -----------------------------------------------------------------------------
// Skill sync
// -----------------------------------------------------------------------------

message SyncSkillRequest {
  string name        = 1;
  string content     = 2;  // full SKILL.md content
  string description = 3;
  repeated string tags = 4;
  repeated SkillFile files = 5;  // optional bundled files under the skill dir
}

// -----------------------------------------------------------------------------
// MCP sync
// -----------------------------------------------------------------------------

message SyncMcpRequest {
  string name    = 1;
  string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string description = 5;
}

// -----------------------------------------------------------------------------
// AgentSpec sync
// -----------------------------------------------------------------------------

message SyncAgentSpecRequest {
  string name        = 1;
  string version     = 2;
  string description = 3;
  repeated string tags = 4;

  // Model specification (provider:model format).
  string model = 5;

  // Prompt configuration.
  PromptSpec prompt = 6;

  // Skills with embedded directory snapshots (SKILL.md + optional files).
  repeated SkillContent skills = 7;

  // Tools configuration.
  ToolsSpec tools = 8;

  // Structured subagent definitions.
  repeated SubagentSpec subagents = 9;

  // Sandbox configuration.
  SandboxSpec sandbox = 10;

  // Tool names that require HITL approval.
  repeated string interrupt_on = 11;

  // Fields 12 and 13 removed: meta_dir/workspace are managed by the data plane.
  reserved 12, 13;
  reserved "meta_dir", "workspace";

  // MCP server configurations.
  repeated McpServerConfig mcp_servers = 14;

  // Extended model configuration (optional, overrides `model` string).
  ModelConfig model_config = 16;
}

// Structured subagent definition.
message SubagentSpec {
  string name         = 1;
  string description  = 2;
  string system_prompt = 3;
  string model        = 4;  // optional, provider:model format
  reserved 5, 6;
  reserved "source", "path";
}

// MCP server connection configuration.
message McpServerConfig {
  string name      = 1;
  string command   = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string transport   = 5;  // "stdio", "sse", "http", "streamable_http"
  string description = 6;
}

message PromptSpec {
  string system = 1;
  reserved 2;
  reserved "memory";
}

message ToolsSpec {
  reserved 1, 2;
  reserved "builtins", "mcp";
}

message SandboxSpec {
  // Legacy implicit sandbox fields kept for compatibility during migration.
  string image = 1 [deprecated = true];
  map<string, string> resources = 2 [deprecated = true];
  repeated string init = 3 [deprecated = true];

  // Common execution policy applied regardless of backend kind.
  SandboxExecutionPolicy execution = 10;

  // Static environment variables injected into the sandbox process.
  repeated SandboxEnvVar env = 11;

  // Commands executed once after sandbox startup and before the agent is used.
  repeated string setup_commands = 12;

  // Exactly one concrete backend must be selected for an executable sandbox.
  oneof backend {
    LocalSandboxSpec local = 20;
    DockerSandboxSpec docker = 21;
    KubernetesSandboxSpec kubernetes = 22;
  }
}

message SandboxExecutionPolicy {
  // Per-command timeout used for normal shell execution. `0` means backend default.
  int32 command_timeout_seconds = 1;

  // Timeout budget for one setup command. `0` means backend default.
  int32 setup_timeout_seconds = 2;

  // Timeout budget for sandbox startup. `0` means backend default.
  int32 startup_timeout_seconds = 3;

  // Maximum UTF-8 output bytes returned from a command. `0` means backend default.
  int64 max_output_bytes = 4;
}

message SandboxEnvVar {
  string name = 1;
  string value = 2;
}

message LocalSandboxSpec {}

message ImageReference {
  string reference = 1;
  ImagePullPolicy pull_policy = 2;
}

enum ImagePullPolicy {
  IMAGE_PULL_POLICY_UNSPECIFIED = 0;
  IMAGE_PULL_POLICY_IF_NOT_PRESENT = 1;
  IMAGE_PULL_POLICY_ALWAYS = 2;
  IMAGE_PULL_POLICY_NEVER = 3;
}

message DockerSandboxSpec {
  ImageReference image = 1;
  DockerResourceSpec resources = 2;
}

message DockerResourceSpec {
  string cpu = 1;
  string memory = 2;
  string shm_size = 3;
  int64 pids_limit = 4;
}

message KubernetesSandboxSpec {
  ImageReference image = 1;
  KubernetesResourceRequirements resources = 2;
}

message KubernetesResourceRequirements {
  map<string, string> requests = 1;
  map<string, string> limits = 2;
}

// One additional file embedded in a skill directory snapshot.
message SkillFile {
  string path    = 1;  // relative path inside the skill dir
  string content = 2;  // UTF-8 text content
}

// Skill content embedded in an agent spec.
message SkillContent {
  string name    = 1;  // skill directory name (e.g., "web-research")
  string content = 2;  // full SKILL.md content (YAML frontmatter + markdown body)
  repeated SkillFile files = 3;  // optional bundled files such as scripts/references
}

// Extended model configuration.
message ModelConfig {
  string provider    = 1;  // e.g., "anthropic", "openai"
  string model       = 2;  // e.g., "claude-sonnet-4-5", "gpt-4o"
  string base_url    = 3;  // optional custom API endpoint
  string api_key     = 4;  // optional direct API key
  string api_key_env = 5;  // optional env var name containing API key
  map<string, string> extra_params = 6;  // additional provider-specific params
}

// -----------------------------------------------------------------------------
// Assembly
// -----------------------------------------------------------------------------

message AssembleRequest {
  // Agent name to compile (must be synced first).
  string agent_name = 1;
}

message AssembleResponse {
  bool   ok      = 1;
  string message = 2;
  string status  = 3;  // "compiled" on success
}

// -----------------------------------------------------------------------------
// Workspace file upload
// -----------------------------------------------------------------------------

message UploadWorkspaceFile {
  // Relative path inside the visible workspace root.
  string path = 1;
  bytes content = 2;
}

message UploadWorkspaceFilesRequest {
  string agent_name = 1;
  string thread_id = 2;
  repeated UploadWorkspaceFile files = 3;
}

message UploadWorkspaceFileResult {
  // Visible workspace path (e.g. "/workspace/file.txt").
  string path = 1;
  // Empty on success, standardized file-operation error on failure.
  string error = 2;
}

message UploadWorkspaceFilesResponse {
  string thread_id = 1;
  repeated UploadWorkspaceFileResult files = 2;
}

// -----------------------------------------------------------------------------
// Resource removal
// -----------------------------------------------------------------------------

message RemoveResourceRequest {
  // Resource type: "agent" or "agent_spec".
  string resource_type = 1;
  string name          = 2;
}

// -----------------------------------------------------------------------------
// Common responses
// -----------------------------------------------------------------------------

message SyncResponse {
  bool   ok      = 1;
  string message = 2;
}

message HealthRequest {}

message HealthResponse {
  // "ok", "degraded", or "unhealthy".
  string status = 1;

  // Number of compiled or running agents ready for execution.
  int32 assembled_agent_count = 2;

  // Data plane uptime in seconds.
  float uptime_seconds = 3;

  // Number of installed agents known to the runtime.
  int32 installed_agent_count = 4;

  // Number of agents currently serving one or more active runs.
  int32 running_agent_count = 5;

  // Whether the runtime is ready to accept run traffic.
  bool ready = 6;
}

enum AgentRuntimeStatus {
  AGENT_RUNTIME_STATUS_UNSPECIFIED = 0;
  AGENT_RUNTIME_STATUS_UNKNOWN = 1;
  AGENT_RUNTIME_STATUS_INSTALLED = 2;
  AGENT_RUNTIME_STATUS_COMPILED = 3;
  AGENT_RUNTIME_STATUS_RUNNING = 4;
}

enum SessionHistoryMode {
  SESSION_HISTORY_MODE_UNSPECIFIED = 0;
  SESSION_HISTORY_MODE_RESUME_VIEW = 1;
  SESSION_HISTORY_MODE_FULL_TRANSCRIPT = 2;
}

enum SessionMessageRole {
  SESSION_MESSAGE_ROLE_UNSPECIFIED = 0;
  SESSION_MESSAGE_ROLE_SYSTEM = 1;
  SESSION_MESSAGE_ROLE_HUMAN = 2;
  SESSION_MESSAGE_ROLE_AI = 3;
  SESSION_MESSAGE_ROLE_TOOL = 4;
}

message ListSessionsRequest {
  string agent_name = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
  string next_page_token = 2;
}

message GetSessionRequest {
  string thread_id = 1;
  string agent_name = 2;
}

message GetSessionResponse {
  bool found = 1;
  SessionDetail session = 2;
}

message GetLatestSessionRequest {
  string agent_name = 1;
}

message GetLatestSessionResponse {
  bool found = 1;
  SessionSummary session = 2;
}

message DeleteSessionRequest {
  string thread_id = 1;
  string agent_name = 2;
}

message DeleteSessionResponse {
  bool deleted = 1;
}

message GetSessionMessagesRequest {
  string thread_id = 1;
  string checkpoint_id = 2;
  int32 page_size = 3;
  string page_token = 4;
  SessionHistoryMode requested_mode = 5;
  bool include_raw = 6;
  string agent_name = 7;
}

message GetSessionMessagesResponse {
  string thread_id = 1;
  string resolved_checkpoint_id = 2;
  SessionHistoryMode actual_mode = 3;
  int32 total_message_count = 4;
  repeated SessionMessage messages = 5;
  string next_page_token = 6;
}

message SessionSummary {
  string thread_id = 1;
  string agent_name = 2;
  google.protobuf.Timestamp updated_at = 3;
  string latest_checkpoint_id = 4;
  int32 message_count = 5;
  string initial_prompt = 6;
  SessionHistoryMode history_mode = 7;
  AgentRuntimeStatus agent_status = 8;
}

message SessionDetail {
  SessionSummary summary = 1;
  int32 checkpoint_count = 2;
}

message SessionMessage {
  int32 index = 1;
  SessionMessageRole role = 2;
  string text = 3;
  string tool_call_id = 4;
  string tool_name = 5;
  bool is_error = 6;
  google.protobuf.Struct raw = 7;
}

